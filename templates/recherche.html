<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Recherche</title>
</head>

<body>

    <h1>Recherche</h1>

    <form method="GET">

        <input
            type="text"
            name="recherche"
            placeholder="Que cherchez-vous ?"
        >

        <button type="submit">Rechercher</button>

    </form>


    {% if mot %}

        <p>Vous avez recherché : {{ mot }}</p>

    {% endif %}

</body>

</html>
